<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crewdesk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%238b7dfa'/%3E%3Crect x='3' y='4' width='4' height='8' fill='%2314131a'/%3E%3Crect x='9' y='4' width='4' height='5' fill='%2314131a'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #14131a; --panel: #1c1b24; --panel-2: #23222d; --line: #302e3c;
    --text: #e8e6f0; --dim: #9d99b0; --accent: #8b7dfa;
    --active: #4ade80; --waiting: #fbbf24; --idle: #64748b; --danger: #f87171;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 13px; }
  button { font: inherit; color: inherit; cursor: pointer; }

  header {
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { font-weight: 700; color: var(--accent); letter-spacing: .5px; }
  .meters { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
  .meter { min-width: 190px; }
  .meter .label { color: var(--dim); font-size: 11px; display: flex; justify-content: space-between; gap: 10px; }
  .bar { height: 6px; background: var(--panel-2); border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .pill { padding: 2px 8px; border-radius: 10px; background: var(--panel-2); color: var(--dim); font-size: 11px; }
  .pill.offline { background: #3a2530; color: var(--danger); border: 1px solid #7c2d12; }

  .tabs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .tabs button { background: var(--panel-2); border: 0; padding: 5px 14px; color: var(--dim); font-size: 12px; }
  .tabs button.on { background: var(--accent); color: #14131a; font-weight: 700; }
  .tabs button:not(.on):hover { color: var(--text); }

  main { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 49px); }
  aside { border-right: 1px solid var(--line); background: var(--panel); padding: 10px; }
  aside h2 { font-size: 11px; text-transform: uppercase; color: var(--dim); margin: 8px 6px; letter-spacing: 1px; }
  .proj {
    display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent;
    border-radius: 8px; padding: 9px 10px; margin-bottom: 4px;
  }
  .proj:hover { background: var(--panel-2); }
  .proj.sel { background: var(--panel-2); border-color: var(--accent); }
  .proj .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .proj .name { font-weight: 600; }
  .proj .path { color: var(--dim); font-size: 11px; margin-top: 2px; word-break: break-all; }
  .proj .q { color: #fb923c; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.active, .dot.running { background: var(--active); box-shadow: 0 0 6px var(--active); }
  .dot.waiting { background: var(--waiting); }
  .dot.idle, .dot.dormant { background: var(--idle); }

  section { padding: 14px 16px; overflow: auto; }
  .sessions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .sess {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 11px; min-width: 240px; max-width: 340px;
  }
  .sess .row { display: flex; align-items: center; gap: 7px; }
  .sess .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .tool { color: var(--accent); font-size: 11px; margin-top: 4px; word-break: break-all; }
  .sess .meta { color: var(--dim); font-size: 11px; margin-top: 3px; }
  .sub { margin-top: 6px; padding-left: 9px; border-left: 2px solid var(--line); color: var(--dim); font-size: 11px; }

  .cols { display: grid; grid-template-columns: repeat(4, minmax(200px, 1fr)); gap: 12px; }
  .col { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .col h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--dim); display: flex; justify-content: space-between; }
  .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px; margin-bottom: 8px; }
  .card .subject { line-height: 1.4; }
  .card .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; align-items: center; }
  .badge { font-size: 10px; padding: 2px 6px; border-radius: 8px; background: #2f2d3b; color: var(--dim); }
  .badge.rounds { background: #3a2530; color: var(--danger); }
  .badge.owner { background: #262a3d; color: #93b4f8; }
  .badge.q { color: #fb923c; }
  .move { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
  .move button { flex: 1; min-width: 0; background: #2b2937; border: 1px solid var(--line); border-radius: 6px;
    padding: 3px 0; font-size: 10px; color: var(--dim); }
  .move button:hover { border-color: var(--accent); color: var(--text); }
  .move button.on { background: var(--accent); color: #14131a; border-color: var(--accent); font-weight: 700; }
  select.assign {
    width: 100%; margin-top: 7px; background: #2b2937; color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 5px; font-size: 11px;
  }
  select.assign:hover { border-color: var(--accent); }
  .empty { color: var(--dim); font-size: 11px; padding: 6px 2px; }
  .blank { grid-column: 1 / -1; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 22px 18px; line-height: 1.6; }
  .blank code { background: var(--panel-2); border-radius: 5px; padding: 1px 6px; color: var(--accent); }
  footer { color: var(--dim); font-size: 11px; padding: 8px 16px; }

  #officeView canvas {
    width: 100%; height: auto; display: block; border: 1px solid var(--line);
    border-radius: 10px; image-rendering: pixelated; background: var(--bg);
  }
  .hint { color: var(--dim); font-size: 11px; margin-top: 8px; line-height: 1.6; }

  #alerts { position: fixed; right: 14px; bottom: 14px; z-index: 50; display: flex;
    max-height: 60vh; overflow-y: auto;
    flex-direction: column; gap: 6px; width: 290px; }
  .alert {
    background: linear-gradient(180deg, #2a1d16, #241a14);
    border: 1px solid #7c2d12; border-left: 4px solid #fb923c;
    border-radius: 10px; padding: 10px 12px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
  }
  .alert:hover { border-color: #fb923c; }
  .alert .who { color: #fdba74; font-weight: 700; font-size: 12px; display: flex;
    justify-content: space-between; gap: 10px; }
  .alert .txt { color: #d6d2e2; font-size: 10.5px; margin-top: 4px; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .alert.more { text-align: center; color: #fdba74; font-size: 11px; padding: 6px; }
  .alert.quiet { background: var(--panel); border-color: var(--line); border-left-color: var(--dim);
    color: var(--dim); font-size: 11px; text-align: center; padding: 6px; cursor: default; }
  .nudge { display: flex; gap: 4px; margin-top: 6px; align-items: center; }
  .nudge input { flex: 1 1 auto; min-width: 0; background: #14131a; color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font: inherit; font-size: 10.5px; }
  .nudge input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .nudge button { background: #2b2937; color: var(--dim); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 8px; font: inherit; font-size: 10.5px; cursor: pointer;
    min-height: 24px; white-space: nowrap; }
  .nudge button:hover, .nudge button:focus-visible { border-color: var(--accent); color: var(--text); }
  .nudge .pending { flex: 1 1 auto; color: #fdba74; font-size: 10px; line-height: 1.3; }
  .alert .x { color: #fdba74; background: none; border: 0; cursor: pointer; font-size: 15px;
    min-width: 24px; min-height: 24px; line-height: 1; padding: 0; border-radius: 4px; }
  .alert .x:hover, .alert .x:focus-visible { background: rgba(251,146,60,0.18); }
  .alert:focus-visible, .proj:focus-visible, .move button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px; }
  .alert .x:hover { color: #fff; }
  .alert-head {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 8px; font-size: 11px; color: var(--dim);
  }
  .alert-head button {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    color: var(--dim); font-size: 10px; padding: 2px 7px; margin-left: 4px;
  }
  .alert-head button:hover { border-color: #fb923c; color: #fdba74; }
  .bell {
    background: var(--panel); border: 1px solid #7c2d12; border-radius: 20px;
    color: #fdba74; font-size: 11px; padding: 6px 14px; align-self: flex-end;
    box-shadow: 0 6px 18px rgba(0,0,0,.4);
  }
  .bell:hover { border-color: #fb923c; color: #fff; }
  select.lang {
    background: var(--panel-2); color: var(--dim); border: 1px solid var(--line);
    border-radius: 8px; padding: 3px 6px; font-size: 11px;
  }
  select.lang:hover { border-color: var(--accent); color: var(--text); }

  /* Dar ekran: sabit 260px kenar çubuğu tahtaya yer bırakmıyordu, dört kolon da
     sığmıyordu. Tablet boyunda tek kolonlu yerleşim + iki kolonlu tahta,
     telefonda tek kolonlu tahta. */
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; min-height: 0; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    section { padding: 12px; }
    .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .sess { min-width: 0; max-width: none; flex: 1 1 220px; }
    /* dar kartta eşit genişlik uzun etiketi ("Fertig") taşırıyordu: buton
       kadarınca yer kaplasın, sığmazsa alt satıra sarsın */
    .move button { flex: 1 1 auto; padding: 3px 4px; }
    /* Dar ekranda sabit panel kartların üstüne binip aşama düğmelerini tıklanamaz
       kılıyordu; burada akışa girsin, tahtanın altında dursun. */
    #alerts { position: static; right: auto; bottom: auto; width: auto;
      max-height: none; margin: 0 12px 12px; }
  }
  @media (max-width: 480px) {
    header { gap: 12px; padding: 8px 12px; }
    .meter { min-width: 140px; }
    .cols { grid-template-columns: minmax(0, 1fr); }
    #alerts { right: 8px; left: 8px; width: auto; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">crewdesk</div>
  <div class="tabs">
    <button id="tabBoard" class="on"></button>
    <button id="tabOffice"></button>
  </div>
  <div class="meters" id="meters"></div>
  <div style="margin-left:auto; display:flex; gap:8px; align-items:center">
    <span class="pill offline" id="offline" hidden></span>
    <select id="langSelect" class="lang"></select>
    <span class="pill" id="clock"></span>
  </div>
</header>

<main>
  <aside>
    <h2 id="projectsHeading"></h2>
    <div id="projects"></div>
  </aside>
  <section>
    <div id="boardView">
      <div class="sessions" id="sessions"></div>
      <div class="cols" id="cols"></div>
    </div>
    <div id="officeView" hidden>
      <canvas id="officeCanvas" role="img" aria-label="Pixel office: each character is an agent, each room shows what it is doing">
        <p id="officeFallback"></p>
      </canvas>
      <div class="hint" id="officeHint"></div>
    </div>
  </section>
</main>
<footer id="footer"></footer>
<div id="alerts"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
